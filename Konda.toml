# Манифест init ОС «Чёрное Море». init собирается СИСТЕМОЙ СБОРКИ Konda
# (`konda build`) — Makefile зовёт фронтенд с этим манифестом, а не транспилятор
# напрямую. Источники не перечисляем: konda build находит основа.конда авто-сканом
# каталога на *.конда (поле «исходники» не поддерживается).

[проект]
имя    = "init"
версия = 0.2.0
тип    = "программа"

[сборка]
аллокатор = "libc"    # init тянул бы libjemalloc.so.2, а в rootfs его нет
стдлиб    = да        # подключить stdlib (libkonda_std.so). Автолинк .so тянет
                      # только libc (у .so аллокатор выбирает потребитель) —
                      # libjemalloc.so.2 НЕ появляется. ⚠ init.elf получает
                      # жёсткую зависимость от libkonda_std.so в rootfs/lib64
                      # (нет файла → kernel panic): образ обязан её содержать.
